name: Importer E2E

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate importer and browser regressions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Run unit tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Build production bundles
        run: npm run build

      - name: Run browser E2E tests
        run: npm run test:e2e
